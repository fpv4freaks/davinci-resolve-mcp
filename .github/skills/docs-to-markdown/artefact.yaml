# --- IDENTITY (required) ---
name: "docs-to-markdown"
description: "Convert Office files (Word, Excel, PowerPoint) and PDF documents into clean Markdown. Handles modern OOXML, legacy binary, IRM/AIP-protected files, and PDF using Python libraries with Office COM fallback. USE WHEN user asks to convert .docx, .xlsx, .xls, .pptx, .ppt, .doc, .pdf files to Markdown, mentions 'convert to md', 'docs to markdown', 'office to markdown', 'extract content from Word/Excel/PowerPoint/PDF', 'convert PDF to markdown', 'pdf to md', or any intent to extract content from Office or PDF files into readable Markdown format. DO NOT USE FOR: creating Office files, editing existing Office files, mail merge, or image-only PDFs (scanned documents without OCR)."

