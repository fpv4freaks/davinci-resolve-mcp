# --- COMPATIBILITY & PREREQUISITES (recommended) ---
compatibility:
  vs_code: ">=1.85"
  copilot: "Agent mode required"
prerequisites:
  mcp_servers: []
  cli_tools:
    - name: "pandoc"
      purpose: "Highest quality Word-to-Markdown conversion"
      required: false
      install: "winget install JohnMacFarlane.Pandoc"
      verify: "pandoc --version"
  python_packages:
    - name: "python-docx"
      purpose: "Read Word documents"
      required: true
      install: "pip install python-docx"
    - name: "openpyxl"
      purpose: "Read modern Excel files"
      required: true
      install: "pip install openpyxl"
    - name: "python-pptx"
      purpose: "Read PowerPoint presentations"
      required: true
      install: "pip install python-pptx"
    - name: "xlrd"
      purpose: "Read legacy Excel files"
      required: true
      install: "pip install xlrd"
    - name: "pywin32"
      purpose: "Office COM automation for IRM-protected and legacy binary files"
      required: false
      platform: windows
      platform_note: "Requires Windows + Microsoft Office desktop. Not available on macOS/Linux."
      install: "pip install pywin32"
    - name: "msoffcrypto-tool"
      purpose: "Detect IRM/encrypted Office files"
      required: true
      install: "pip install msoffcrypto-tool"
    - name: "PyMuPDF"
      purpose: "Read PDF files (text, tables, and structure)"
      required: true
      install: "pip install PyMuPDF"
  npm_packages: []
  extensions: []
  environment: []

