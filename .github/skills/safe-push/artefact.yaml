# artefact.yaml — safe-push metadata for catalog indexing
# All valid enum values are documented in .github/skills/skill-creator/references/mappings-reference.md

# --- IDENTITY (required) ---
name: "safe-push"
description: "Safely push current branch changes to GitHub — surveys branch state so merged or deleted branches are never offered as push targets, rebases on latest main, handles conflicts, fork detection, merged branch recovery, stale branch sweep, and create/update Pull Requests. Tracks stash state throughout and never loses work."

# --- OWNERSHIP (required) ---
author: "Daniel Wojcik"
maintainers:
  - "@dwojcik_microsoft"
support: "dwojcik@microsoft.com"

# --- VERSION & LIFECYCLE (required) ---
version: "1.3"
created: 2026-03-01
updated: 2026-08-21
license: "MIT"
status: production

# --- CLASSIFICATION (required) ---
type: skill
category: technical
installer-group: productivity
roles:
  - technical-consultant
  - functional-consultant
  - solution-architect
phases:
  - build

# --- METHODOLOGY MAPPING (recommended) ---
methodologies:
  - SureStep365

surestep365:
  phases:
    - config-dev-sprints
  activities:
    - code: "05-04"
      name: "Configuration & Development activity set"
    - code: "05-09"
      name: "CI/CD Release Management"

# --- COMPATIBILITY & PREREQUISITES (recommended) ---
compatibility:
  vs_code: ">=1.85"
  copilot: "Agent mode required"
prerequisites:
  mcp_servers: []
  cli_tools:
    - name: "Git"
      purpose: "Version control operations (rebase, push, stash)"
      required: true
      install: "winget install Git.Git"
      verify: "git --version"
    - name: "GitHub CLI (gh)"
      purpose: "Fork detection, PR creation, branch management"
      required: true
      install: "winget install GitHub.cli"
      verify: "gh --version"
  python_packages: []
  npm_packages: []
  extensions: []
  environment: []

# --- DOCUMENTATION (recommended) ---
documentation: "https://github.com/mcaps-microsoft/ISDAIFirstAiBS/blob/main/.github/skills/safe-push/README.md"
repo: "mcaps-microsoft/ISDAIFirstAiBS"
project: ""

# --- PRODUCT MAPPING (recommended) ---
product-family:
  - github
products:
  - github

# --- TECHNOLOGIES & TAGS (optional) ---
technologies:
  - github-copilot
tags:
  - git
  - push
  - rebase
  - pull-request
  - fork
  - version-control
allowed-tools: ""
distribution:
