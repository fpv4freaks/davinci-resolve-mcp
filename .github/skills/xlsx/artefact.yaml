# --- METHODOLOGY MAPPING (recommended) ---
methodologies:
  - SureStep365

surestep365:
  phases:
    - all
  activities:
    - code: "01-11"
      name: "Create/refine the One Services Estimator (OSE)"
    - code: "04-04"
      name: "Review/identify requirements/user stories"
    - code: "05-06"
      name: "Data Migration mapping & script development"

# --- COMPATIBILITY & PREREQUISITES (recommended) ---
compatibility:
  vs_code: ">=1.85"
  copilot: "Agent mode required"
prerequisites:
  mcp_servers: []
  cli_tools:
    - name: "LibreOffice (soffice)"
      purpose: "Recalculate formulas and scan for #REF!/#DIV/0!/#VALUE!/#NAME? errors"
      required: true
      install: "winget install TheDocumentFoundation.LibreOffice"
      verify: "soffice --version"
  python_packages:
    - name: "pandas"
      purpose: "Bulk data analysis, multi-sheet reads, CSV/TSV interop"
      required: true
      install: "pip install pandas"
    - name: "openpyxl"
      purpose: "Formula- and format-preserving writes to .xlsx"
      required: true
      install: "pip install openpyxl"
  npm_packages: []
  extensions: []
  environment: []

