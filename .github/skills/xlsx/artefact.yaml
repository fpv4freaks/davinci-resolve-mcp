  - "@pavelkoval_microsoft"
  - "@dandreje_microsoft"
  - "@dwojcik_microsoft"
support: "@pavelkoval_microsoft"

# --- VERSION & LIFECYCLE (required) ---
version: "1.0"
created: 2026-05-20
updated: 2026-05-20
license: "Proprietary (Anthropic) — see LICENSE.txt"
