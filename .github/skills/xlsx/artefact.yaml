# --- IDENTITY (required) ---
name: "xlsx"
description: "Create, edit, and analyze Excel (.xlsx, .xlsm, .csv, .tsv) spreadsheets. Build financial models with industry-standard formatting (blue inputs, black formulas, green cross-sheet links), use pandas for data analysis and openpyxl for formula/format preservation, and force-recalculate via LibreOffice to guarantee zero formula errors before delivery."

# --- OWNERSHIP (required) ---
author: "Anthropic (upstream); integrated by Pavel Koval"
