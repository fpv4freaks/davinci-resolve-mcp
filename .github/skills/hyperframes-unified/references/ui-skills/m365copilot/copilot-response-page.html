              </p>
              <span class="m365r-response__citation">microsoft +1</span>

              <div class="m365r-response__divider"></div>

              <!-- Section 2 -->
              <h2 class="m365r-response__h2">Core Feature Areas of Microsoft 365 Copilot</h2>
              <h3 class="m365r-response__h3">1. Copilot in Microsoft 365 Apps (In-App Assistance)</h3>
              <p class="m365r-response__p">
                Copilot is <strong>natively embedded</strong> into core Microsoft 365 workloads and responds in the context of what you're doing:
              </p>
              <ul class="m365r-response__list">
                <li class="m365r-response__li"><strong>Word</strong> – Draft documents from prompts, rewrite for tone or clarity, summarize long content</li>
                <li class="m365r-response__li"><strong>Excel</strong> – Analyze data, explain trends, generate formulas, summarize tables</li>
                <li class="m365r-response__li"><strong>PowerPoint</strong> – Generate presentations from documents or prompts, rewrite slides, design content</li>
                <li class="m365r-response__li"><strong>Outlook</strong> – Draft replies, summarize email threads, extract action items</li>
                <li class="m365r-response__li"><strong>Teams</strong> – Summarize meetings, capture decisions, list follow-ups and unanswered questions</li>
              </ul>
              <span class="m365r-response__citation">microsoft +1</span>

              <div class="m365r-response__divider"></div>

              <!-- Section 3 -->
              <h3 class="m365r-response__h3">2. Microsoft 365 Copilot Chat (AI Chat for Work)</h3>
              <p class="m365r-response__p">
                Copilot Chat is a <strong>persistent AI workspace</strong> where users can:
              </p>
              <ul class="m365r-response__list">
                <li class="m365r-response__li">Ask questions using natural language about their work</li>
                <li class="m365r-response__li">Reference files, meetings, emails, and chats directly in prompts</li>
                <li class="m365r-response__li">Maintain long-running conversations to think through work over time</li>
                <li class="m365r-response__li">Resume context across devices and sessions</li>
              </ul>
