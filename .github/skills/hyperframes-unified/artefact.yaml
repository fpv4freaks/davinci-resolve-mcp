name: "hyperframes-unified"
description: "Unified HyperFrames video production skill — covers composition authoring, animation adapters (GSAP, Anime.js, CSS, WAAPI, Lottie, Three.js, WebGPU), Tailwind CSS v4, CLI dev loop, media preprocessing, registry, catalog contribution, website-to-video, UI skills (Dynamics 365 and M365 Copilot sub-compositions), and skill discovery."

