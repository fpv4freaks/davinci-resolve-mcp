# --- COMPATIBILITY & PREREQUISITES (recommended) ---
compatibility:
  vs_code: ">=1.85"
  copilot: "Agent mode required"
prerequisites:
  mcp_servers: []
  cli_tools:
    - name: "Node.js"
      purpose: "HyperFrames CLI runtime"
      required: true
      install: "https://nodejs.org/"
      verify: "node --version"
    - name: "FFmpeg"
      purpose: "Video rendering and encoding"
      required: true
      install: "https://ffmpeg.org/"
      verify: "ffmpeg -version"
  python_packages:
    - name: "kokoro-onnx"
      purpose: "Text-to-speech generation"
      required: false
      install: "pip install kokoro-onnx soundfile"
  npm_packages:
    - name: "hyperframes"
      purpose: "HyperFrames CLI for init, lint, preview, render"
      required: true
      install: "npx hyperframes"
  extensions: []
  environment: []

