# --- IDENTITY (required) ---
name: "docx"
description: "Create, edit, read, and analyze Microsoft Word (.docx) documents. Generate polished documents with docx-js, edit existing files via raw XML manipulation preserving tracked changes and comments, and extract or convert content with pandoc and LibreOffice."

# --- OWNERSHIP (required) ---
author: "Anthropic (upstream); integrated by Pavel Koval"
maintainers:
  - "@pavelkoval_microsoft"
  - "@dandreje_microsoft"
  - "@dwojcik_microsoft"
support: "@pavelkoval_microsoft"

# --- VERSION & LIFECYCLE (required) ---
version: "1.0"
created: 2026-05-20
updated: 2026-05-20
license: "Proprietary (Anthropic) — see LICENSE.txt"
status: production

# --- CLASSIFICATION (required) ---
type: skill
category: productivity
installer-group: productivity
roles:
  - all
phases:
  - all

# --- METHODOLOGY MAPPING (recommended) ---
methodologies:
  - SureStep365

surestep365:
  phases:
    - all
  activities:
    - code: "04-10"
      name: "Document outcomes and key areas of change impact"
    - code: "04-11"
      name: "Start first version of Solution Design Document with all sections updated"
    - code: "08-15"
      name: "Create system operations guide"

# --- COMPATIBILITY & PREREQUISITES (recommended) ---
compatibility:
  vs_code: ">=1.85"
  copilot: "Agent mode required"
prerequisites:
  mcp_servers: []
  cli_tools:
    - name: "pandoc"
      purpose: "Text extraction with tracked-changes annotations"
      required: true
      install: "winget install JohnMacFarlane.Pandoc"
      verify: "pandoc --version"
    - name: "LibreOffice (soffice)"
      purpose: "DOCX↔PDF conversion and accepting tracked changes"
      required: true
      install: "winget install TheDocumentFoundation.LibreOffice"
      verify: "soffice --version"
    - name: "Poppler (pdftoppm)"
      purpose: "PDF→image rendering for visual QA"
      required: false
      install: "choco install poppler"
      verify: "pdftoppm -v"
    - name: "Node.js + npm"
      purpose: "Run docx-js for new-document generation"
      required: true
      install: "winget install OpenJS.NodeJS"
      verify: "node --version"
  python_packages: []
  npm_packages:
    - name: "docx"
      purpose: "JavaScript library for generating new Word documents"
      required: true
      install: "npm install -g docx"
  extensions: []
  environment: []

# --- DOCUMENTATION (recommended) ---
documentation: "https://github.com/mcaps-microsoft/ISDAIFirstAiBS/blob/main/.github/skills/docx/README.md"
repo: "mcaps-microsoft/ISDAIFirstAiBS"
project: ""

# --- PRODUCT MAPPING (recommended) ---
product-family:
