# --- IDENTITY (required) ---
name: "create-repo"
description: "Create a new GitHub repository for the current workspace and push initial commit. Supports personal repos and org repos (e.g. mcaps-microsoft) with Internal visibility. Add collaborators (EMU accounts auto-resolved from names or aliases), protect main branch with rulesets, configure CODEOWNERS and access.yml for org repos, and integrate with safe-push for team workflows. Also manages existing repos — shows current setup, proposes changes to collaborators, protection, visibility, CODEOWNERS, and access.yml. On JIT-capable org repos (mcaps-microsoft and any repo with .github/ISSUE_TEMPLATE/JitAccess.yml), admin-only operations auto-file a JIT Request issue, draft a Teams ping for an approver from access.yml, and resume the queued operation after approval."

